[workspace]
resolver = "2"
members = [
    "packages/core/game-engine",
    "packages/core/protocol",
    "packages/core/utils",
    "packages/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DeepGames Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true